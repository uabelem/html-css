<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridLayout na prática</title>
    <style>

        div.container{
            height: 250px;
            border: 3px solid blue;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;/* O gap cria espaços apenas entre os itens e não nas margens do conteiner */
            align-items: stretch;
            justify-items: stretch;
            align-content: stretch;
            justify-content: stretch;
        }

        div.item{
            border: 3px solid red;
            padding: 5px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="itema">A</div>
        <div class="item" id="itemb">B</div>
        <div class="item" id="itemc">C</div>
        <div class="item" id="itemd">D</div>
        <div class="item" id="iteme">E</div>
        <div class="item" id="itemf">F</div>
        <div class="item" id="itemg">G</div>
    </div>
</body>
</html>
