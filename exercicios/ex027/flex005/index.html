<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizando com FlexBox</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }
        body{
            background-color: #dcdcdc;
        }
        main{
            background-color: darkgray;
            width:100vw;
            height:100vh;
            display: flex;
            flex-flow: row nowrap; /*Alinhamento em linha e sem quebras*/
            justify-content: center; /*Alinha horizontalmente*/
            align-items: center; /*Alinha vertivalmente*/
        }
        section{
            background-color: white;
            width: 200px;
            height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <section>LOGIN</section>
    </main>
</body>
</html>
