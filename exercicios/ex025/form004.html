<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de dados pessoais</title>
</head>

<body>
    <h1>Teste de dados pessoais</h1>
    <form action="cadrastro.js" autocomplete="on" method="post">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="nome">Nome:</label>
                <input autocomplete="name" type="text" name="nome" id="nome" required minlength="5" maxlength="30" placeholder="Nome completo" size="30">
            </p>
            <p>
                <label for="email">E-mail::</label>
                <input autocomplete="email" type="email" name="email" id="email" required minlength="8" placeholder="E-mail" size="30">
            </p>
            <p>
                <label for="tel">Telefone:</label>
                <input type="tel" name="tel" id="tel" autocomplete="tel" required placeholder="(xx)xxxxx-xxxx" pattern="^\(\d{2}\)\d{4,5}-\d{4}$">
            </p>
            <!-- Estudar mais sobre RegEx -> pattern -->
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset">
        </p>
    </form>
</body>

</html>
