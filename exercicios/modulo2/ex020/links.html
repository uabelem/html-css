<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        
        /*
                SELETORES PERSONALIZADOS
                # = id
                . = class
                : = pseudo-classe
                :: = pseudo-elemento
                > = filho
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color: #d6d6d6;
            text-decoration: underline;
        }

        a:active {
            color: white;
        }

        a::before {
            content: ">> ";
        }

        a::after {
            content: " [link]";
            color: #d6d6d6;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: 100;
            font-size: 13px
        }
    </style>
</head>

<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/uabelem" target="_blank">Perfil do GitHub</a></li>
        <li><a href="https://www.instagram.com/uabelem" target="_blank">Perfil do Instagram</a></li>
        <li><a href="https://www.tinkercad.com/users/uabelem" target="_blank">Perfil do Tinkercad</a></li>
    </ul>

</body>

</html>
