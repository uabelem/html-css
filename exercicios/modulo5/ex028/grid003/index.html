<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino - Grid Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: grid;
            height: 100vh;
            grid-template-rows: repeat(6, 1fr);
            grid-template-columns: repeat(5, 1fr);
        }

        header {
            grid-area: 1 / 1 / 2 / 6;
            background-color: darkblue;
        }

        nav {
            grid-area: 2 / 1 / 6 / 2;
            background-color: darkmagenta;
        }

        main {
            grid-area: 2 / 2 / 6 / 5;
            background-color: darkred;
        }

        aside {
            grid-area: 2 / 5 / 6 / 6;
            background-color: darkgreen;
        }

        footer {
            grid-area: 6 / 1 / 7 / 6;
            background-color: darkgoldenrod;
        }

        @media (max-width:768px) {

            body {
                grid-template-rows: repeat(12, 1fr);
                grid-template-columns: repeat(5, 1fr);
            }

            nav {
                grid-area: 2 / 1 / 3 / 6;
            }

            main {
                grid-area: 3 / 1 / 9 / 6;
            }

            aside {
                grid-area: 9 / 1 / 12 / 6;
            }

            footer {
                grid-area: 12 / 1 / 13 / 6;
            }
        }
    </style>
</head>

<body>

    <header>header</header>
    <nav>nav</nav>
    <main>main</main>
    <aside>aside</aside>
    <footer>footer</footer>

</body>

</html>
