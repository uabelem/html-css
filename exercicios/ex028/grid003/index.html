<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridLayout na prática</title>
    <style>
        div.container {
            border: 3px solid blue;
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            /* repeat = repete  3 vezes  uma fração(1fr) do conteiner*/
            gap: 5px;
            place-items: stretch stretch;
            place-content: stretch stretch;
            grid-auto-rows: 100px;
            grid-auto-columns: auto;
            grid-auto-flow: column;
            /*Inca como os itens iraão se organizar*/

        }

        div.item {
            border: 3px solid red;
            padding: 5px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item" id="itema">A</div>
        <div class="item" id="itemb">B</div>
        <div class="item" id="itemc">C</div>
        <div class="item" id="itemd">D</div>
        <div class="item" id="iteme">E</div>
        <div class="item" id="itemf">F</div>
        <div class="item" id="itemg">G</div>
        <div class="item" id="itemh">H</div>
        <div class="item" id="itemi">I</div>
    </div>
</body>

</html>
