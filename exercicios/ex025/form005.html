<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de dados pessoais</title>
</head>

<body>
    <h1>Teste de dados pessoais</h1>
    <form action="cadrastro.js" autocomplete="on" method="get">
        <fieldset>
            <legend>Função</legend>
            <p>
                <input type="radio" name="funcao" id="aluno" required>
                <label for="aluno">Aluno</label>
                
                <input type="radio" name="funcao" id="prof" required>
                <label for="prof">Professor</label>
            </p>
        </fieldset>
        <fieldset id="fp">
            <legend>Função Pedágogica</legend>
            <input type="checkbox" name="dir" id="dir"><label for="dir">Diretor(a)</label><br>
            <input type="checkbox" name="vice" id="vice"><label for="vice">Vice Diretor(a)</label><br>
            <input type="checkbox" name="sec" id="sec"><label for="sec">Secretário(a)</label><br>
            <input type="checkbox" name="prof" id="prof"><label for="prof">Professor</label><br>
            <input type="checkbox" name="profa" id="profa"><label for="profa">Professor(a) Ed. Esp.</label><br>
            <input type="checkbox" name="func" id="func"><label for="func">Funcionário</label>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset">
        </p>
    </form>
</body>

</html>
