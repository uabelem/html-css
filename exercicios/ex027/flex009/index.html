<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: #106793;

            display: flex;
            flex-flow: row nowrap; /* NOWRAP tem que está ativo para o FLEX-BASIS encolher o item */
        }
        div.item{
            background-color: #add8e6;
            border: 1px solid #1886ae;
            text-align: center;
            flex-basis: 150px; /* "FLEX-BASIS" faz que os itens tenham um certo tamanho enquanto couber na tela, se não, ele encolhe até quebrar*/

        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">BBBBBBBBBBBBB</div>
        <div class="item">C</div>
        <div class="item">DDDDDDDDDDDD</div>
        <div class="item">E</div>
        <div class="item">FFFFFFFFFFFF</div>
        <div class="item">G</div>
    </div>
</body>
</html>
